services:
  - type: web
    name: job-event-processing-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKER
        value: "true"
      - key: WORKER_COUNT
        value: "2"
      - key: MONGO_URI
        sync: false
