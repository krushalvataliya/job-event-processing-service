services:
  mongo:
    image: mongo:7.0
    container_name: jobevents-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobevents
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobevents-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobevents-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongo:27017/jobevents
      - LOG_LEVEL=info
      - RUN_WORKER=false
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      sh -c "node dist/scripts/setup.js && node dist/src/api/server.js"
    networks:
      - jobevents-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobevents-worker
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/jobevents
      - WORKER_COUNT=2
      - WORKER_POLL_INTERVAL_MS=200
      - WORKER_LEASE_MS=15000
      - RETRY_BASE_DELAY_MS=500
      - RETRY_MAX_ATTEMPTS=3
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_started
    command: ["node", "dist/src/worker/index.js"]
    networks:
      - jobevents-net

networks:
  jobevents-net:
    driver: bridge

volumes:
  mongo_data:
